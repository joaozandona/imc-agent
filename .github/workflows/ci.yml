name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test shared
        run: npm run test -w @imc/shared

      - name: Test API
        run: npm run test -w @imc/api

      - name: Test web
        run: npm run test -w @imc/web

      - name: Build
        env:
          # Next/server code reads these at build/runtime; CI values are disposable.
          JWT_SECRET: ci-jwt-secret-not-for-production
          API_URL: http://localhost:3333
        run: npm run build
